receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  docker_stats:
    endpoint: unix:///var/run/docker.sock
    collection_interval: 60s

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024
  resource:
    attributes:
      - action: insert
        key: service.instance.id
        value: "${HOSTNAME}"
      - action: insert
        key: deployment.environment.name
        value: "${OTEL_ENVIRONMENT}"
  tail_sampling:
    decision_wait: 10s
    num_traces: 50000
    policies:
      [
        {
          name: health-check-low-sampling,
          type: and,
          and:
            {
              and_sub_policy:
                [
                  {
                    name: health-check-endpoint-policy,
                    type: string_attribute,
                    string_attribute:
                      {
                        key: uri,
                        values: [.*\/health.*],
                        enabled_regex_matching: true,
                      },
                  },
                  {
                    name: sample-health-checks,
                    type: probabilistic,
                    probabilistic: { sampling_percentage: 2 },
                  },
                ],
            },
        },
        {
          name: fully-sample-default,
          type: and,
          and:
            {
              and_sub_policy:
                [
                  {
                    name: not-health-check-endpoint,
                    type: string_attribute,
                    string_attribute:
                      {
                        key: uri,
                        values: [.*\/health.*],
                        enabled_regex_matching: true,
                        invert_match: true,
                      },
                  },
                  { name: always-sample, type: always_sample },
                ],
            },
        },
      ]

exporters:
  # No x-honeycomb-dataset header: in a Honeycomb Environment, traces
  # land in the dataset named after service.name. So:
  #   service.name = syllabus-tracker        -> syllabus-tracker dataset
  #   service.name = nginx-syllabus-tracker  -> nginx-syllabus-tracker dataset
  #   service.name = nginx-do-host           -> nginx-do-host dataset
  otlp_http/traces:
    endpoint: "https://api.honeycomb.io:443"
    headers:
      "x-honeycomb-team": "${HONEYCOMB_API_KEY}"
  # Metrics need explicit dataset routing; unlike traces, Honeycomb does NOT
  # auto-route metrics by service.name. Both app metrics and nginx metrics
  # require an x-honeycomb-dataset header.
  otlp_http/metrics:
    endpoint: "https://api.honeycomb.io:443"
    headers:
      "x-honeycomb-team": "${HONEYCOMB_API_KEY}"
      "x-honeycomb-dataset": "syllabus-tracker-metrics"
  debug:
    verbosity: normal

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch, resource, tail_sampling]
      exporters: [otlp_http/traces]
    metrics:
      receivers: [docker_stats, otlp]
      processors: [batch, resource]
      exporters: [otlp_http/metrics]

  telemetry:
    metrics:
      level: none
