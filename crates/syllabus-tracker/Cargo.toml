[package]
name = "syllabus-tracker"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
default-run = "syllabus-tracker"

[features]
# Exposes #[cfg(test)] helpers in the library (e.g. videos::media::test_support)
# so the binary's integration tests can use them. CI and `just test-backend`
# pass `--all-features`, which turns this on automatically.
test-support = ["video-media/test-support"]

[dependencies]
migration-engine = { path = "../migration-engine" }

# db
sqlx = { workspace = true }

# web framework
rkt = { version = "=1.3.0", features = ["trace", "json", "secrets", "tls"] }
validator = { version = "0.21.0", features = ["derive"] }
serde = { version = "1.0.219", features = ["derive"] }
time = { workspace = true }
serde_json = "1.0.140"

# auth
thiserror = "2.0"
anyhow = { workspace = true }
bcrypt = "0.19.3"  # For password hashing

# Otel
opentelemetry_sdk = { version = "0.33.1", features = ["logs", "trace", "rt-tokio"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
opentelemetry-otlp = { version = "0.33.1", features = ["metrics", "trace", "grpc-tonic", "tls-aws-lc", "tls-roots", "tls-webpki-roots"] }
opentelemetry = { version = "0.33.1", features = ["trace"] }
opentelemetry-semantic-conventions = { version = "0.33.1", features = ["semconv_experimental"] }
tracing-core = "0.1.33"
tracing-opentelemetry = "0.34.0"
once_cell = "1.21.3"
either = "1.15.0"
env_logger = "0.11.8"
rand = "0.10.3"
uuid = { version = "1.16.0", features = ["v4"] }
regex = { workspace = true }
tokio = { workspace = true }
dotenvy = { workspace = true }

# seed binary terminal UI
indicatif = { workspace = true }

video-media = { path = "../video-media" }
video-job = { path = "../video-job" }
async-trait = "0.1.83"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
opentelemetry_sdk = { version = "0.33.1", features = ["testing"] }

[package.metadata.cargo-machete]
# tracing-core: re-exported by the tracing crate; direct pin keeps version stable.
# either: indirect dep pinned for semver consistency with opentelemetry ecosystem.
ignored = ["tracing-core", "either"]
