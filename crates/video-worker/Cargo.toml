[package]
name = "video-worker"
edition.workspace = true
version.workspace = true
rust-version.workspace = true

[[bin]]
name = "video-worker"
path = "src/main.rs"

[[bin]]
name = "transcode-server"
path = "src/bin/transcode-server.rs"

[dependencies]
# Shared crates
video-media = { path = "../video-media" }
video-job = { path = "../video-job" }

# Async runtime
tokio = { workspace = true, features = ["signal"] }

# HTTP server (mock-transcoder only; same version as the app uses)
axum = { version = "0.7", default-features = false, features = ["json", "tokio", "http1"] }

# HTTP client (no native-tls; rustls only for container portability)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Error handling
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# OpenTelemetry (worker spans exported direct to Honeycomb over OTLP/HTTP).
# HTTP exporter (reqwest) keeps Cloud Run egress on plain HTTPS, no gRPC.
opentelemetry = { version = "0.29.1", features = ["trace"] }
opentelemetry_sdk = { version = "0.29.0", features = ["trace", "rt-tokio"] }
# Blocking reqwest client (not async): the SDK's BatchSpanProcessor exports from
# a dedicated OS thread with no tokio reactor, so the async reqwest client panics
# there ("no reactor running") and silently drops every span. The blocking client
# works without an ambient runtime. See deploy logs 2026-06-17.
opentelemetry-otlp = { version = "0.29.0", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client", "reqwest-rustls"] }
opentelemetry-semantic-conventions = { version = "0.29.0" }
tracing-opentelemetry = "0.30.0"

# UUID generation
uuid = { version = "1.16", features = ["v4"] }

# JSON serialization
serde_json = "1.0.140"

# Constant-time comparison (bearer token check)
subtle = "2.6.1"
