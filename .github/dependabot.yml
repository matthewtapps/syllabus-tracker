# Minor and patch updates land as one weekly PR per ecosystem; each major
# and each rkt release (a single-maintainer fork) arrives as its own PR.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Australia/Sydney
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      minor-and-patch:
        patterns: ["*"]
        exclude-patterns: ["rkt"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Australia/Sydney
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Australia/Sydney
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/, /frontend, /crates/video-worker]
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Australia/Sydney
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    # The Rust builder images move in lockstep with the flake toolchain and
    # workspace rust-version, which Dependabot cannot bump together.
    ignore:
      - dependency-name: rust
      - dependency-name: lukemathwalker/cargo-chef

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Australia/Sydney
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Australia/Sydney
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      inputs:
        patterns: ["*"]

  - package-ecosystem: opentofu
    directory: /infra
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Australia/Sydney
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
